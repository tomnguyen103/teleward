language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
  path_filters:
    - "!package-lock.json"
    - "!dist/**"
    - "!graphify-out/**"
    - "!.codegraph/**"
    - "!.ua/**"
    - "!.scratch/**"
    - "!public/data/ptbxl_120.bin"
    - "!public/data/ptbxl_index.json"
